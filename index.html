<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Encouragement Heart - Thai Only</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    // รวมคำให้กำลังใจภาษาไทยล้วน
    const phrases = [
        "สู้ๆ นะ!", "เก่งมากแล้ว", "อย่ายอมแพ้", "คุณทำได้!", 
        "พักผ่อนบ้างนะ", "ยิ้มเยอะๆ", "เป็นกำลังใจให้นะ", 
        "เหนื่อยก็พักก่อน", "ทำดีที่สุดแล้ว", "กอดๆ นะ", 
        "พรุ่งนี้เอาใหม่", "เชื่อมั่นในตัวเอง", "ผ่านมันไปได้แน่นอน",
        "ค่อยๆ ก้าวไป", "ไม่ต้องเครียดนะ", "เธอเก่งที่สุด"
    ];

    const colors = ["#ff0055", "#ff3300", "#ff66aa", "#ff0000", "#ffffff", "#00f0ff", "#ff00ff", "#39ff14", "#ffff00"];

    const points = [];
    const numPoints = 200;

    for (let i = 0; i < numPoints; i++) {
        const t = (i / numPoints) * (2 * Math.PI);
        const scaleBase = 10 + Math.random() * 8; 

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        const text = phrases[i % phrases.length];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const fontSize = Math.floor(Math.random() * (16 - 10 + 1)) + 10;

        points.push({
            t: t,
            baseX: x * scaleBase,
            baseY: y * scaleBase,
            text: text,
            color: color,
            fontSize: fontSize,
            speed: 0.01 + Math.random() * 0.02, 
            offset: Math.random() * Math.PI * 2 
        });
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let time = 0;

    function animate() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        time += 0.015; 

        for (let i = 0; i < points.length; i++) {
            const p = points[i];

            const pulse = 1 + 0.15 * Math.sin(time * 3 + p.offset);
            
            const rotationOffset = 0.05 * Math.sin(time + p.t);
            const currentT = p.t + rotationOffset;

            const x = 16 * Math.pow(Math.sin(currentT), 3) * (10 + p.fontSize * 0.3) * pulse;
            const y = (13 * Math.cos(currentT) - 5 * Math.cos(2 * currentT) - 2 * Math.cos(3 * currentT) - Math.cos(4 * currentT)) * (10 + p.fontSize * 0.3) * pulse;

            const drawX = centerX + x;
            const drawY = centerY - y;

            ctx.shadowBlur = 12;
            ctx.shadowColor = p.color;

            ctx.font = `bold ${p.fontSize}px 'Segoe UI', Arial, sans-serif`;
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, drawX, drawY);
        }

        ctx.shadowBlur = 0;
        requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
